name: Update security news

on:
  schedule:
    - cron: "0 * * * *"   # كل ساعة
  workflow_dispatch:       # يسمح بالتشغيل اليدوي للتجربة

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Update news"
          git push
